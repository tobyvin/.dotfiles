[main]
font = monospace:size=15
include = /usr/share/foot/themes/gruvbox-dark

[colors-dark]
alpha = 0.95
background = 1d2021

[bell]
urgent = yes

[scrollback]
lines = 10000

[cursor]
style = beam

[mouse]
hide-when-typing = yes

[key-bindings]
spawn-terminal=Control+Shift+t
search-start=Control+Shift+space

[search-bindings]
find-prev=Control+p
find-next=Control+n
